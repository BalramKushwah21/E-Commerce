<link rel="stylesheet" href="../CSS/login.css">

    
<title>Login</title>
<div>
    <img id="logo" src="../Res/logo.jpeg" >
</div>
<form id="login_box">
            <h1>Login Page</h1>
            
            <input type="text" id="login-email" name="email" placeholder="Email / Username" required>
            <br>

            
            <input type="password" id="login-password" name="password" placeholder="Password" required>
            <br>

        

            <button type="submit" id="login_button">LOGIN</button>

            <div class="continue_line">Login with</div>

            <div class="continue_box">
                <button type="button" class="google-btn">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" class="icon">
                    Google
                </button>

                <button type="button" class="facebook-btn">
                    <img src="https://www.svgrepo.com/show/452196/facebook-1.svg" class="icon">
                    Facebook
                </button>
            

            
        </div>
        <h3 class="signup">Not a member? <a href="signup.html">Signup now</a> 
        </form>
   

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>"    
    <script src="../JavaScript/auth.js"></script>
